services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: pathfinder
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - buses-test-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d pathfinder"]
      interval: 5s
      timeout: 5s
      retries: 10

  kafka:
    image: apache/kafka:3.9.0
    ports:
      - "127.0.0.1:9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: INTERNAL://:29092,CONTROLLER://:29093,EXTERNAL://:9092
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:29092,EXTERNAL://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:29093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:29092 --list >/dev/null 2>&1",
        ]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s

  kafka-init:
    image: apache/kafka:3.9.0
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - |
        for topic in buses.driver.list buses.driver.create buses.bus.list buses.bus.get buses.bus.create buses.bus.change-status buses.commands.v1 bus.validate bus.status.changed travel.created buses.validation.requests.v1 buses.events.v1 bff.replies.v1 routes.replies.v1 bus.validate.reply; do
          /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:29092 --create --if-not-exists --topic "$$topic" --partitions 1 --replication-factor 1
        done
    depends_on:
      kafka:
        condition: service_healthy
    restart: "no"

  migrate:
    image: migrate/migrate:v4.18.3
    command:
      - -path
      - /migrations
      - -database
      - postgres://postgres:postgres@postgres:5432/pathfinder?sslmode=disable
      - up
    volumes:
      - ./migrations:/migrations:ro
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  test-db-init:
    image: postgres:16-alpine
    profiles: ["test"]
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - |
        if ! psql -h postgres -U postgres -d postgres -tAc "SELECT 1 FROM pg_database WHERE datname = 'pathfinder_test'" | grep -q 1; then
          createdb -h postgres -U postgres pathfinder_test
        fi
    environment:
      PGPASSWORD: postgres
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  migrate-test:
    image: migrate/migrate:v4.18.3
    profiles: ["test"]
    command:
      - -path
      - /migrations
      - -database
      - postgres://postgres:postgres@postgres:5432/pathfinder_test?sslmode=disable
      - up
    volumes:
      - ./migrations:/migrations:ro
    depends_on:
      test-db-init:
        condition: service_completed_successfully
    restart: "no"

  go-test:
    image: golang:1.27.4-alpine
    profiles: ["test"]
    working_dir: /src
    volumes:
      - .:/src
    environment:
      POSTGRES_TEST_DSN: postgres://postgres:postgres@postgres:5432/pathfinder_test?sslmode=disable
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - |
        go test -coverprofile=coverage.out ./...
        go tool cover -func=coverage.out | tail -n 1
    depends_on:
      migrate-test:
        condition: service_completed_successfully
    restart: "no"

  buses:
    build:
      context: .
    environment:
      APP_ENV: development
      PORT: "8080"
      POSTGRES_DSN: postgres://postgres:postgres@postgres:5432/pathfinder?sslmode=disable
      KAFKA_BROKERS: kafka:29092
      KAFKA_TOPIC: bus.status.changed
      KAFKA_BFF_COMMANDS_TOPIC: buses.commands.v1
      KAFKA_BUS_VALIDATION_TOPIC: buses.validation.requests.v1
      KAFKA_REPLY_TOPICS: bff.replies.v1,routes.replies.v1,bus.validate.reply
      KAFKA_CONSUMER_GROUP: pathfinder-buses-bff-v1
      KAFKA_ROUTES_CONSUMER_GROUP: pathfinder-buses-routes-v1
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped

volumes:
  buses-test-postgres-data:
